<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e8dcff" />
  <meta name="description" content="윤호의 한글 월드 — 프리미엄 키즈 학습 RPG 월드맵" />
  <title>윤호의 한글 월드</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Dongle:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/worldmap.css" />
</head>
<body>
  <div class="portrait-hint" aria-hidden="true">
    <p>태블릿을 가로로 돌려주세요 📱↔️<br />월드맵은 가로 화면에 최적화되어 있어요.</p>
  </div>

  <div class="loader" id="loader" aria-live="polite" aria-busy="true">
    <div class="loader-card">
      <img id="loaderLogo" class="loader-logo" alt="윤호의 한글 월드" width="320" height="120" />
      <p>모험 지도를 불러오는 중...</p>
      <div class="loader-bar"><span id="loaderBar"></span></div>
    </div>
  </div>

  <main class="app-shell">
    <div class="worldmap-stage" id="worldmapStage">
      <img id="worldmapBg" class="worldmap-bg" alt="" width="1920" height="1080" />
      <div class="worldmap-vignette" aria-hidden="true"></div>

      <div class="ambient-particles" id="ambientParticles" aria-hidden="true"></div>

      <div class="world-map-container" id="worldMapContainer">
      <svg class="map-paths" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="pathGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffd56a" />
            <stop offset="50%" stop-color="#ff9ed4" />
            <stop offset="100%" stop-color="#8d4df5" />
          </linearGradient>
        </defs>
        <path id="mapPath" d="" />
      </svg>

      <div class="world-nodes" id="worldNodes" role="group" aria-label="월드 선택"></div>

      <header class="logo-wrap logo-wrap--hub">
        <div class="logo-sparkles" aria-hidden="true">
          <i>✦</i><i>✧</i><i>★</i>
        </div>
        <img src="" id="mainLogo" alt="윤호의 한글 월드" width="280" height="100" />
      </header>

      <aside class="hud-left">
        <div class="star-panel">
          <div class="star-icon" aria-hidden="true">⭐</div>
          <span class="star-count" id="starCount">0</span>
          <span class="star-label">별</span>
        </div>
        <div class="progress-panel">
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="progress-text" id="progressText">0%</span>
        </div>
      </aside>

      <nav class="hud-right" aria-label="게임 메뉴">
        <button type="button" class="icon-btn icon-btn--subtle" id="resetBtn" aria-label="진행 초기화" title="진행 초기화">↺</button>
        <button type="button" class="icon-btn" id="soundBtn" aria-label="소리 켜기/끄기" title="소리">🔊</button>
        <button type="button" class="icon-btn" id="homeBtn" aria-label="홈" title="홈">🏠</button>
      </nav>

      </div><!-- world-map-container -->
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="unlock-overlay" id="unlockOverlay" role="dialog" aria-modal="true" aria-labelledby="unlockTitle">
    <article class="unlock-card">
      <div class="unlock-particles" id="unlockParticles" aria-hidden="true"></div>
      <div class="unlock-lock" id="unlockLock" aria-hidden="true">🔒</div>
      <img class="unlock-character" id="unlockCharacter" alt="" width="160" height="160" />
      <h2 class="unlock-title" id="unlockTitle">새로운 월드가 열렸어요!</h2>
      <p class="unlock-sub" id="unlockSub">새로운 모험이 기다려요</p>
      <button type="button" class="unlock-go" id="unlockGo">출발하기</button>
    </article>
  </div>

  <script>
    document.getElementById("mainLogo").src =
      ["assets", "logo", "yoonho_logo.png"].map(encodeURIComponent).join("/");
  </script>
  <script src="js/progress.js"></script>
  <script src="js/worldmap.js"></script>
</body>
</html>
