<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>글자탐험대</title>

  <!-- 키즈앱용 둥근 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Dongle:wght@400;700&family=Poor+Story&display=swap" rel="stylesheet">

  <style>
    :root {
      --purple:#8d4df5;
      --purple2:#6b32d6;
      --pink:#ff5eb8;
      --yellow:#ffe76a;
      --orange:#ffb84f;
      --green:#54d681;
      --mint:#74ead4;
      --sky:#91ddff;
      --blue:#7dafff;
      --ink:#493073;
      --soft-ink:#7d68a7;
      --white:#fff;
      --shadow: 0 20px 50px rgba(83, 54, 145, .22);
      --button-shadow: 0 8px 0 rgba(104,63,190,.24), 0 16px 26px rgba(83,54,145,.16);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Jua", "Dongle", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(255,255,255,.85) 0 34px, transparent 35px),
        radial-gradient(circle at 82% 6%, rgba(255,255,255,.75) 0 42px, transparent 43px),
        linear-gradient(180deg, #c6efff 0%, #d9dcff 47%, #efdcff 100%);
    }

    body::before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:-5;
      background:
        radial-gradient(circle at 12% 30%, rgba(124, 224, 255, .55), transparent 23%),
        radial-gradient(circle at 88% 22%, rgba(255, 231, 134, .48), transparent 18%),
        radial-gradient(circle at 82% 72%, rgba(255, 143, 201, .32), transparent 22%),
        radial-gradient(circle at 28% 80%, rgba(113, 232, 202, .45), transparent 22%);
      filter: blur(1px);
    }

    .forest {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index:-4;
      pointer-events:none;
    }

    .hill {
      position:absolute;
      left:-15%;
      right:-15%;
      bottom:-120px;
      height:260px;
      border-radius:50% 50% 0 0;
      background: linear-gradient(180deg, #98ec8f, #57c974);
      opacity:.8;
    }
    .hill.two {
      bottom:-160px;
      transform:scaleX(1.2);
      background:linear-gradient(180deg,#6edb79,#3caf62);
      opacity:.55;
    }

    .tree {
      position:absolute;
      bottom:56px;
      width:74px;
      height:150px;
      opacity:.5;
    }
    .tree::before {
      content:"";
      position:absolute;
      left:31px;
      top:62px;
      width:16px;
      height:90px;
      border-radius:999px;
      background:#9b6b48;
    }
    .tree::after {
      content:"";
      position:absolute;
      left:0;
      top:0;
      width:78px;
      height:78px;
      border-radius:50%;
      background:#62d37a;
      box-shadow: -24px 36px 0 #79df8b, 25px 34px 0 #51c96d;
    }
    .t1 { left:-14px; transform:scale(1.25); }
    .t2 { right:-24px; bottom:92px; transform:scale(1.35); }
    .t3 { left:68%; bottom:70px; transform:scale(.75); opacity:.35; }

    .sparkle-layer {
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:2;
      overflow:hidden;
    }
    .sparkle {
      position:absolute;
      color:white;
      font-family:system-ui;
      text-shadow:0 0 18px rgba(255,255,255,.9);
      animation: twinkle 2.4s ease-in-out infinite;
      opacity:.8;
    }
    .sparkle:nth-child(1){ left:11%; top:14%; font-size:18px; }
    .sparkle:nth-child(2){ left:43%; top:9%; font-size:24px; animation-delay:.4s; }
    .sparkle:nth-child(3){ right:12%; top:27%; font-size:20px; animation-delay:.9s; }
    .sparkle:nth-child(4){ left:18%; bottom:26%; font-size:17px; animation-delay:1.3s; }
    .sparkle:nth-child(5){ right:26%; bottom:33%; font-size:25px; animation-delay:1.7s; }
    @keyframes twinkle {
      0%, 100% { transform:scale(.55) rotate(0deg); opacity:.25; }
      50% { transform:scale(1.22) rotate(16deg); opacity:1; }
    }

    .app {
      position:relative;
      z-index:1;
      width:min(520px, 100%);
      min-height:100vh;
      margin:0 auto;
      padding: 20px 16px 104px;
    }

    .screen { display:none; }
    .screen.active { display:block; animation: pageIn .28s ease both; }
    @keyframes pageIn {
      from { opacity:0; transform:translateY(12px); }
      to { opacity:1; transform:translateY(0); }
    }

    .top-row {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 6px;
    }

    .circle-btn {
      width:58px;
      height:58px;
      border:0;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:#7340de;
      background:linear-gradient(145deg,#fff,#fff5dd);
      box-shadow: 0 8px 0 rgba(255,255,255,.58), 0 14px 26px rgba(86,56,145,.18);
      font-size:38px;
      font-family:system-ui;
      font-weight:900;
    }

    .level-badge {
      padding: 9px 18px 8px;
      border-radius:999px;
      color:white;
      font-size:26px;
      line-height:1;
      background:linear-gradient(180deg,#79ef8e,#2cc965);
      text-shadow:0 2px 0 rgba(0,0,0,.1);
      box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 7px 0 #159c4a, 0 15px 24px rgba(55,169,91,.2);
    }

    .stage-hero {
      position:relative;
      min-height: 220px;
      padding-top: 12px;
    }

    .title-block {
      position:relative;
      z-index:4;
      width:61%;
      padding-left: 4px;
    }

    .world-title {
      margin:0;
      font-size:58px;
      line-height:.82;
      letter-spacing:-1px;
      color:#2bb96e;
      text-shadow:
        0 4px 0 #fff,
        4px 0 0 #fff,
        -4px 0 0 #fff,
        0 -4px 0 #fff,
        0 10px 16px rgba(60,138,95,.24);
    }

    .world-title .leaf {
      font-size:26px;
      color:#37b963;
      text-shadow:none;
    }

    .instruction {
      margin: 17px 0 0;
      font-size:31px;
      line-height:.94;
      color:#50327e;
      text-shadow:0 2px 0 rgba(255,255,255,.8);
    }

    .mascot-wrap {
      position:absolute;
      right:-6px;
      top:8px;
      width:198px;
      height:200px;
      z-index:3;
      animation: float 3.7s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform:translateY(0); }
      50% { transform:translateY(-10px); }
    }

    .speech {
      position:absolute;
      right:0;
      top:4px;
      z-index:5;
      transform:translateY(-8px);
      padding:13px 16px 12px;
      border-radius:28px 28px 28px 9px;
      background:#fffef7;
      color:#39247f;
      font-size:22px;
      line-height:.95;
      box-shadow:0 12px 28px rgba(86,56,145,.16);
      text-align:center;
    }

    .dino {
      position:absolute;
      inset:16px 0 0 2px;
    }
    .dino-body {
      position:absolute;
      left:38px;
      top:76px;
      width:120px;
      height:92px;
      border-radius:58px 60px 48px 48px;
      background:linear-gradient(145deg,#9bffad,#38cd78);
      box-shadow:inset -15px -14px rgba(16,106,67,.1), 0 20px 30px rgba(43,173,104,.28);
    }
    .dino-belly {
      position:absolute;
      left:82px;
      top:101px;
      width:52px;
      height:62px;
      border-radius:50%;
      background:#fff0bc;
      opacity:.95;
      box-shadow:inset 0 -5px rgba(222,167,70,.12);
    }
    .dino-head {
      position:absolute;
      left:66px;
      top:22px;
      width:108px;
      height:94px;
      border-radius:54px 58px 52px 55px;
      background:linear-gradient(145deg,#a9ffb7,#51da87);
      box-shadow:inset -14px -13px rgba(16,106,67,.09);
    }
    .dino-eye {
      position:absolute;
      left:93px;
      top:58px;
      width:20px;
      height:29px;
      border-radius:50%;
      background:#372454;
      box-shadow:43px 2px 0 #372454;
    }
    .dino-eye::before {
      content:"";
      position:absolute;
      left:5px;
      top:5px;
      width:7px;
      height:9px;
      border-radius:50%;
      background:white;
      box-shadow:43px 2px 0 white;
    }
    .dino-mouth {
      position:absolute;
      left:107px;
      top:88px;
      width:42px;
      height:26px;
      border-radius:0 0 30px 30px;
      background:#8b2c4b;
      overflow:hidden;
    }
    .dino-mouth::after {
      content:"";
      position:absolute;
      left:8px;
      bottom:-5px;
      width:27px;
      height:14px;
      border-radius:50%;
      background:#ff7faa;
    }
    .dino-cheek {
      position:absolute;
      left:75px;
      top:86px;
      width:24px;
      height:14px;
      border-radius:50%;
      background:rgba(255,132,174,.76);
      box-shadow:82px 2px 0 rgba(255,132,174,.76);
    }
    .dino-tail {
      position:absolute;
      left:12px;
      top:107px;
      width:64px;
      height:34px;
      border-radius:54px 8px 8px 54px;
      background:#38cd78;
      transform:rotate(-21deg);
    }
    .dino-spike {
      position:absolute;
      left:86px;
      top:11px;
      width:26px;
      height:26px;
      border-radius:6px 18px 6px 6px;
      background:#ffd84f;
      transform:rotate(45deg);
      box-shadow:30px 5px 0 #ffc44f, 56px 18px 0 #ffc44f;
    }
    .dino-arm {
      position:absolute;
      left:43px;
      top:112px;
      width:25px;
      height:16px;
      border-radius:999px;
      background:#2ebc69;
      transform:rotate(-24deg);
      box-shadow:95px -3px 0 #2ebc69;
    }

    .progress-box {
      display:flex;
      align-items:center;
      gap:10px;
      padding:9px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.72);
      box-shadow: inset 0 2px 5px rgba(68,42,130,.11), 0 12px 28px rgba(86,56,145,.14);
      margin-bottom:15px;
    }

    .star-coin {
      width:36px;
      height:36px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:linear-gradient(145deg,#fff9a8,#ffc73f);
      box-shadow:0 4px 0 #e49c24;
      font-family:system-ui;
      animation:bob 1.6s ease-in-out infinite;
    }
    @keyframes bob { 50% { transform:translateY(-3px) rotate(8deg); } }

    .progress-track {
      flex:1;
      height:20px;
      border-radius:999px;
      overflow:hidden;
      background:rgba(86,71,130,.13);
      box-shadow:inset 0 2px 4px rgba(0,0,0,.08);
    }
    .progress-fill {
      height:100%;
      width:20%;
      border-radius:999px;
      background:linear-gradient(90deg,#61e7ff,#825bff,#ff6bd4);
      position:relative;
      transition:width .35s ease;
    }
    .progress-fill::after {
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);
      animation:shine 1.8s linear infinite;
    }
    @keyframes shine {
      from { transform:translateX(-100%); }
      to { transform:translateX(100%); }
    }

    .progress-count {
      min-width:58px;
      text-align:center;
      color:#8a52ff;
      font-size:26px;
      line-height:1;
    }

    .question-card {
      position:relative;
      padding: 34px 18px 34px;
      min-height: 220px;
      border-radius:42px;
      background:
        radial-gradient(circle at 18% 23%, rgba(255,210,246,.72), transparent 23%),
        radial-gradient(circle at 80% 18%, rgba(255,245,174,.74), transparent 25%),
        linear-gradient(145deg, rgba(255,255,255,.98), rgba(255,253,247,.93));
      border:3px solid rgba(255,255,255,.82);
      box-shadow: inset 0 -9px 22px rgba(125,175,255,.08), 0 12px 0 rgba(255,255,255,.45), var(--shadow);
      text-align:center;
      overflow:hidden;
    }

    .question-card::before, .question-card::after {
      content:"✦";
      position:absolute;
      font-family:system-ui;
      color:rgba(255,108,195,.42);
      font-size:26px;
      animation: twinkle 2s ease-in-out infinite;
    }
    .question-card::before { left:24px; top:24px; }
    .question-card::after { right:45px; bottom:33px; animation-delay:.8s; }

    .sound-btn {
      position:absolute;
      right:24px;
      top:23px;
      width:62px;
      height:62px;
      border:0;
      border-radius:50%;
      background:linear-gradient(145deg,#fff,#eadbff);
      color:#7540db;
      font-size:31px;
      box-shadow:0 7px 0 #ad7bf0, 0 14px 25px rgba(86,56,145,.18);
      font-family:system-ui;
    }

    .big-letter {
      margin-top:16px;
      font-size:104px;
      line-height:.9;
      color:#8151ee;
      text-shadow:0 5px 0 #c8a8ff, 0 11px 22px rgba(82,46,160,.25);
    }

    .prompt {
      margin-top:20px;
      font-size:36px;
      line-height:.92;
      color:#7a55d5;
      text-shadow:0 2px 0 rgba(255,255,255,.85);
    }

    .choices {
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:14px;
      margin-top:22px;
    }

    .choice {
      min-height:88px;
      border:3px solid rgba(255,255,255,.88);
      border-radius:34px;
      font-family:"Jua", sans-serif;
      font-size:43px;
      color:#4c2a21;
      cursor:pointer;
      background:linear-gradient(145deg,#fffef8,#fff0bd);
      box-shadow:0 8px 0 #eebc50, 0 16px 27px rgba(86,56,145,.13);
      position:relative;
      overflow:hidden;
    }
    .choice:nth-child(2) {
      background:linear-gradient(145deg,#fff,#ecdcff);
      box-shadow:0 8px 0 #b889ef, 0 16px 27px rgba(86,56,145,.13);
      color:#6a3ed2;
    }
    .choice:nth-child(3) {
      background:linear-gradient(145deg,#fff,#dff9ff);
      box-shadow:0 8px 0 #78cbe8, 0 16px 27px rgba(86,56,145,.13);
      color:#247f9e;
    }
    .choice:nth-child(4) {
      background:linear-gradient(145deg,#fff,#ffdeec);
      box-shadow:0 8px 0 #ee83ad, 0 16px 27px rgba(86,56,145,.13);
      color:#a63868;
    }
    .choice:active {
      transform:translateY(6px);
      box-shadow:0 2px 0 rgba(0,0,0,.16), 0 12px 22px rgba(86,56,145,.13);
    }
    .choice.correct {
      background:linear-gradient(145deg,#fff9c9,#e8c4ff 52%,#c897ff);
      color:#5a24cf;
      box-shadow:0 0 0 5px rgba(255,255,255,.9), 0 0 34px rgba(255,226,77,.95), 0 8px 0 #925ee5;
      animation: correctPop .62s ease both;
    }
    .choice.correct::before {
      content:"정답!";
      position:absolute;
      left:50%;
      top:0;
      transform:translateX(-50%);
      padding:6px 24px;
      border-radius:0 0 18px 18px;
      background:linear-gradient(145deg,#ff73c5,#ff3ca8);
      color:#fff;
      font-size:22px;
      text-shadow:0 2px 0 rgba(0,0,0,.12);
    }
    .choice.wrong { filter:saturate(.45); opacity:.72; }
    @keyframes correctPop {
      0% { transform:scale(1); }
      48% { transform:scale(1.08); }
      100% { transform:scale(1); }
    }

    .reward {
      display:none;
      position:relative;
      min-height:92px;
      margin-top:18px;
      padding:17px 115px 16px 88px;
      border-radius:34px;
      background:
        radial-gradient(circle at 14% 20%, rgba(255,233,90,.78), transparent 21%),
        linear-gradient(145deg, rgba(255,255,255,.96), rgba(255,246,255,.9));
      border:3px solid rgba(255,255,255,.85);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .reward.show { display:block; animation: rewardIn .44s ease both; }
    @keyframes rewardIn {
      from { opacity:0; transform:translateY(14px) scale(.94); }
      to { opacity:1; transform:translateY(0) scale(1); }
    }
    .hamster {
      position:absolute;
      left:15px;
      bottom:10px;
      width:66px;
      height:66px;
      border-radius:50%;
      background:linear-gradient(145deg,#ffc47f,#e78e43);
      box-shadow:inset -8px -8px rgba(83,42,20,.09);
    }
    .hamster::before, .hamster::after {
      content:"";
      position:absolute;
      top:0;
      width:21px;
      height:21px;
      border-radius:50%;
      background:#ffd199;
    }
    .hamster::before { left:3px; }
    .hamster::after { right:3px; }
    .ham-face {
      position:absolute;
      left:20px;
      top:29px;
      width:7px;
      height:7px;
      border-radius:50%;
      background:#44222b;
      box-shadow:19px 0 0 #44222b, 9px 11px 0 -1px #44222b;
    }
    .reward h3 {
      margin:0;
      font-size:37px;
      line-height:.9;
      color:#2bb69e;
      text-shadow:0 2px 0 #fff;
      white-space:nowrap;
    }
    .reward h3 span { color:#ff55b0; }
    .reward p {
      margin:8px 0 0;
      font-family:"Dongle";
      font-size:28px;
      line-height:.86;
      color:#705d9f;
    }
    .sticker-pack {
      position:absolute;
      right:17px;
      top:21px;
      display:flex;
      gap:6px;
      font-size:29px;
      font-family:system-ui;
      filter:drop-shadow(0 5px 5px rgba(91,44,198,.18));
      animation:bob 1.5s ease-in-out infinite;
    }

    .home-card, .panel {
      margin-top:18px;
      padding:24px;
      border-radius:38px;
      background:rgba(255,255,255,.82);
      border:3px solid rgba(255,255,255,.8);
      box-shadow:var(--shadow);
    }
    .home-card h2, .panel h2 {
      margin:0 0 16px;
      font-size:43px;
      line-height:.9;
      color:#6230d6;
      text-shadow:0 2px 0 #fff;
    }
    .world {
      width:100%;
      border:0;
      border-radius:30px;
      margin:13px 0;
      padding:13px;
      display:grid;
      grid-template-columns:66px 1fr;
      gap:14px;
      align-items:center;
      text-align:left;
      background:linear-gradient(145deg,#fff,#fff2bd);
      box-shadow:0 7px 0 #eebc50, 0 15px 25px rgba(86,56,145,.13);
      font-family:"Jua", sans-serif;
      color:var(--ink);
    }
    .world:nth-of-type(2) { background:linear-gradient(145deg,#fff,#ecdcff); box-shadow:0 7px 0 #b889ef, 0 15px 25px rgba(86,56,145,.13); }
    .world:nth-of-type(3) { background:linear-gradient(145deg,#fff,#dff9ff); box-shadow:0 7px 0 #78cbe8, 0 15px 25px rgba(86,56,145,.13); }
    .world:nth-of-type(4) { background:linear-gradient(145deg,#fff,#ffdeec); box-shadow:0 7px 0 #ee83ad, 0 15px 25px rgba(86,56,145,.13); }
    .world-icon {
      width:66px;
      height:66px;
      border-radius:25px;
      display:grid;
      place-items:center;
      font-size:34px;
      background:rgba(255,255,255,.65);
      font-family:system-ui;
    }
    .world h3 { margin:0; font-size:31px; line-height:.9; }
    .world p {
      margin:7px 0 0;
      font-family:"Dongle", sans-serif;
      font-size:27px;
      line-height:.86;
      color:#7660a6;
    }

    .panel p {
      margin:0;
      font-family:"Dongle", sans-serif;
      font-size:30px;
      line-height:.92;
      color:#7660a6;
    }
    .stats {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:18px;
    }
    .stat {
      text-align:center;
      border-radius:28px;
      background:linear-gradient(145deg,#fff,#fff4d8);
      box-shadow:0 7px 0 #eebc50, 0 15px 25px rgba(86,56,145,.13);
      padding:17px;
    }
    .stat strong {
      display:block;
      font-size:46px;
      line-height:.9;
      color:#ff55b0;
    }
    .stat span {
      font-size:25px;
      color:#6b56a0;
    }

    .tabbar {
      position:fixed;
      left:50%;
      bottom:max(12px, env(safe-area-inset-bottom));
      transform:translateX(-50%);
      width:min(506px, calc(100% - 16px));
      height:84px;
      padding:8px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:6px;
      border-radius:35px 35px 26px 26px;
      background:rgba(255,255,255,.88);
      backdrop-filter:blur(18px);
      box-shadow:0 -4px 0 rgba(255,255,255,.6), 0 18px 48px rgba(76,48,130,.25);
      z-index:40;
    }
    .tab {
      border:0;
      border-radius:27px;
      background:transparent;
      font-family:"Jua", sans-serif;
      font-size:18px;
      color:#837fa7;
      display:grid;
      place-items:center;
      align-content:center;
      gap:2px;
    }
    .tab span {
      font-size:25px;
      line-height:1;
      font-family:system-ui;
    }
    .tab.active {
      color:white;
      background:linear-gradient(180deg,#b66dff,#7839e6);
      box-shadow:0 9px 0 #5e25bf, 0 13px 20px rgba(91,44,198,.28);
      text-shadow:0 2px 0 rgba(0,0,0,.12);
    }

    .confetti {
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:99;
      overflow:hidden;
      display:none;
    }
    .confetti.show { display:block; }
    .confetti i {
      position:absolute;
      top:-20px;
      width:10px;
      height:16px;
      border-radius:4px;
      animation:fall 1.2s linear forwards;
    }
    @keyframes fall {
      to { transform:translateY(110vh) rotate(720deg); opacity:.2; }
    }

    .start-overlay {
      position:fixed;
      inset:0;
      z-index:120;
      display:grid;
      place-items:center;
      padding:20px;
      background:linear-gradient(145deg,rgba(194,239,255,.86),rgba(236,211,255,.9));
      backdrop-filter:blur(12px);
    }
    .start-card {
      width:min(420px,100%);
      border-radius:42px;
      padding:28px 24px;
      text-align:center;
      background:rgba(255,255,255,.9);
      border:3px solid rgba(255,255,255,.85);
      box-shadow:var(--shadow);
    }
    .start-card h1 {
      margin:0;
      font-size:54px;
      line-height:.86;
      color:#6b32d6;
      text-shadow:0 3px 0 #fff;
    }
    .start-card p {
      margin:16px 0 20px;
      font-family:"Dongle";
      font-size:31px;
      line-height:.9;
      color:#7660a6;
    }
    .start-btn {
      border:0;
      border-radius:30px;
      padding:17px 28px;
      font-family:"Jua";
      font-size:31px;
      color:white;
      background:linear-gradient(180deg,#ff85ca,#ff4caf);
      box-shadow:0 8px 0 #d82c86, 0 16px 30px rgba(216,44,134,.22);
    }

    @media (max-width:420px) {
      .world-title { font-size:50px; }
      .instruction { font-size:28px; }
      .stage-hero { min-height:205px; }
      .mascot-wrap { width:170px; height:174px; right:-16px; top:20px; }
      .speech { font-size:19px; right:1px; }
      .big-letter { font-size:90px; }
      .prompt { font-size:31px; }
      .choice { min-height:80px; font-size:38px; }
      .reward { padding-right:90px; }
      .reward h3 { font-size:32px; }
      .sticker-pack { font-size:25px; right:13px; }
    }
  </style>
</head>

<body>
  <div class="forest">
    <div class="hill"></div>
    <div class="hill two"></div>
    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>
  </div>

  <div class="sparkle-layer">
    <span class="sparkle">✦</span><span class="sparkle">✧</span><span class="sparkle">✦</span>
    <span class="sparkle">✧</span><span class="sparkle">✦</span>
  </div>

  <div class="confetti" id="confetti"></div>

  <div class="start-overlay" id="startOverlay">
    <div class="start-card">
      <h1>글자탐험대</h1>
      <p>공룡 친구가 문제를 읽어줘요.<br>정답을 맞히면 축하음과 스티커가 나와요!</p>
      <button class="start-btn" onclick="startApp()">학습 시작하기 ✨</button>
    </div>
  </div>

  <main class="app">
    <section id="lesson" class="screen active">
      <div class="top-row">
        <button class="circle-btn" onclick="showScreen('home')">‹</button>
        <div class="level-badge">1단계</div>
        <div style="width:58px"></div>
      </div>

      <div class="stage-hero">
        <div class="title-block">
          <h1 class="world-title"><span id="lessonTitle">공룡숲</span><span class="leaf">🍃</span></h1>
          <div class="instruction" id="lessonDesc">자음 소리를 듣고 맞는 글자를 골라요.</div>
        </div>

        <div class="speech" id="speechBubble">잘하고<br>있어요! 💕</div>

        <div class="mascot-wrap" aria-hidden="true">
          <div class="dino">
            <div class="dino-tail"></div>
            <div class="dino-body"></div>
            <div class="dino-belly"></div>
            <div class="dino-head"></div>
            <div class="dino-spike"></div>
            <div class="dino-eye"></div>
            <div class="dino-cheek"></div>
            <div class="dino-mouth"></div>
            <div class="dino-arm"></div>
          </div>
        </div>
      </div>

      <div class="progress-box">
        <div class="star-coin">⭐</div>
        <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
        <div class="progress-count" id="count">1/5</div>
      </div>

      <div class="question-card">
        <button class="sound-btn" onclick="speakQuestion(true)">🔊</button>
        <div class="big-letter" id="questionText">ㄱ</div>
        <div class="prompt" id="promptText">“기역”은 어디 있을까?</div>
      </div>

      <div class="choices" id="choices"></div>

      <div class="reward" id="reward">
        <div class="hamster"><div class="ham-face"></div></div>
        <h3 id="rewardTitle">우와! <span>정답이에요!</span></h3>
        <p id="rewardText">스티커 2개를 받았어요! ✨</p>
        <div class="sticker-pack">⭐ ⭐</div>
      </div>
    </section>

    <section id="home" class="screen">
      <div class="home-card">
        <h2>오늘은 어디로<br>떠나볼까?</h2>
        <button class="world" onclick="openLesson('dino')">
          <div class="world-icon">🦖</div>
          <div><h3>공룡숲</h3><p>자음 소리 찾기</p></div>
        </button>
        <button class="world" onclick="openLesson('block')">
          <div class="world-icon">🧱</div>
          <div><h3>블록동굴</h3><p>자음+모음 조합하기</p></div>
        </button>
        <button class="world" onclick="openLesson('ham')">
          <div class="world-icon">🐹</div>
          <div><h3>햄찌마을</h3><p>그림 보고 단어 찾기</p></div>
        </button>
        <button class="world" onclick="openLesson('sea')">
          <div class="world-icon">🦈</div>
          <div><h3>바다왕국</h3><p>고래상어와 단어 읽기</p></div>
        </button>
      </div>
    </section>

    <section id="review" class="screen">
      <div class="panel">
        <h2>복습 상자 🎁</h2>
        <p>틀렸던 글자를 다시 만나볼 수 있어요. 다음 버전에서 자동 복습 기능을 연결하면 좋아요.</p>
        <button class="world" onclick="openLesson('dino')">
          <div class="world-icon">⭐</div>
          <div><h3>오늘의 복습</h3><p>자주 틀리는 글자 다시 풀기</p></div>
        </button>
      </div>
    </section>

    <section id="parent" class="screen">
      <div class="panel">
        <h2>부모 리포트 📊</h2>
        <p>이 기기 브라우저에 학습 기록이 저장돼요.</p>
        <div class="stats">
          <div class="stat"><strong id="statSolved">0</strong><span>푼 문제</span></div>
          <div class="stat"><strong id="statCorrect">0</strong><span>정답</span></div>
          <div class="stat"><strong id="statRate">0%</strong><span>정답률</span></div>
          <div class="stat"><strong id="statStars">0</strong><span>스티커</span></div>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab" onclick="showScreen('home')"><span>🏠</span>홈</button>
    <button class="tab active" onclick="showScreen('lesson')"><span>📖</span>학습</button>
    <button class="tab" onclick="showScreen('review')"><span>⭐</span>복습</button>
    <button class="tab" onclick="showScreen('parent')"><span>😊</span>부모</button>
  </nav>

  <script>
    const lessons = {
      dino: {
        title: "공룡숲",
        desc: "자음 소리를 듣고 맞는 글자를 골라요.",
        level: "1단계",
        items: [
          { q:"ㄱ", prompt:"“기역”은 어디 있을까?", choices:["ㄹ","ㄴ","ㄱ","ㅁ"], answer:"ㄱ", speak:"기역은 어디 있을까?" },
          { q:"ㄴ", prompt:"“니은”은 어디 있을까?", choices:["ㄹ","ㄴ","ㅅ","ㅇ"], answer:"ㄴ", speak:"니은은 어디 있을까?" },
          { q:"ㄷ", prompt:"“디귿”을 골라볼까?", choices:["ㅂ","ㅈ","ㄷ","ㅎ"], answer:"ㄷ", speak:"디귿을 골라볼까?" },
          { q:"ㅁ", prompt:"“미음”은 어디 있을까?", choices:["ㅁ","ㄱ","ㅊ","ㅋ"], answer:"ㅁ", speak:"미음은 어디 있을까?" },
          { q:"ㅅ", prompt:"“시옷”을 찾아볼까?", choices:["ㅇ","ㅅ","ㄹ","ㅍ"], answer:"ㅅ", speak:"시옷을 찾아볼까?" }
        ]
      },
      block: {
        title:"블록동굴",
        desc:"자음과 모음을 합쳐 글자를 만들어요.",
        level:"2단계",
        items:[
          { q:"ㄱ + ㅏ", prompt:"합치면 어떤 글자가 될까?", choices:["가","거","고","구"], answer:"가", speak:"기역과 아를 합치면 어떤 글자일까?" },
          { q:"ㄴ + ㅏ", prompt:"합치면 어떤 글자가 될까?", choices:["다","나","마","라"], answer:"나", speak:"니은과 아를 합치면 어떤 글자일까?" },
          { q:"ㄷ + ㅏ", prompt:"합치면 어떤 글자가 될까?", choices:["바","다","사","자"], answer:"다", speak:"디귿과 아를 합치면 어떤 글자일까?" },
          { q:"ㅁ + ㅏ", prompt:"합치면 어떤 글자가 될까?", choices:["마","머","모","무"], answer:"마", speak:"미음과 아를 합치면 어떤 글자일까?" }
        ]
      },
      ham: {
        title:"햄찌마을",
        desc:"그림을 보고 단어를 골라요.",
        level:"3단계",
        items:[
          { q:"🍎", prompt:"사과의 첫 글자는?", choices:["사","마","나","가"], answer:"사", speak:"사과의 첫 글자는 무엇일까?" },
          { q:"🌳", prompt:"나무의 첫 글자는?", choices:["나","다","마","바"], answer:"나", speak:"나무의 첫 글자는 무엇일까?" },
          { q:"⭐", prompt:"별의 글자는?", choices:["벌","별","발","불"], answer:"별", speak:"별의 글자는 무엇일까?" },
          { q:"🍚", prompt:"밥의 글자는?", choices:["밥","밤","방","발"], answer:"밥", speak:"밥의 글자는 무엇일까?" }
        ]
      },
      sea: {
        title:"바다왕국",
        desc:"고래상어와 낱말을 읽어요.",
        level:"4단계",
        items:[
          { q:"고래", prompt:"같은 단어를 찾아줘!", choices:["고래","거래","노래","고리"], answer:"고래", speak:"고래와 같은 단어를 찾아줘." },
          { q:"바다", prompt:"같은 단어를 찾아줘!", choices:["보다","바다","마다","바보"], answer:"바다", speak:"바다와 같은 단어를 찾아줘." },
          { q:"상어", prompt:"같은 단어를 찾아줘!", choices:["상어","상자","사자","상추"], answer:"상어", speak:"상어와 같은 단어를 찾아줘." },
          { q:"파도", prompt:"같은 단어를 찾아줘!", choices:["파도","파리","포도","파란"], answer:"파도", speak:"파도와 같은 단어를 찾아줘." }
        ]
      }
    };

    let current = lessons.dino;
    let index = 0;
    let solved = Number(localStorage.getItem("solved") || 0);
    let correct = Number(localStorage.getItem("correct") || 0);
    let audioCtx = null;
    let soundUnlocked = false;
    let autoSpeak = true;

    function startApp() {
      document.getElementById("startOverlay").style.display = "none";
      unlockAudio();
      soundUnlocked = true;
      render();
      setTimeout(() => speakQuestion(true), 450);
    }

    function unlockAudio() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        playTinyUnlockSound();
      } catch(e) {}
    }

    function playTinyUnlockSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 1;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.02);
    }

    function showScreen(id) {
      unlockAudio();
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      const order = ["home","lesson","review","parent"];
      document.querySelectorAll(".tab")[order.indexOf(id)].classList.add("active");
      updateStats();
      if (id === "lesson" && soundUnlocked) setTimeout(() => speakQuestion(true), 400);
    }

    function openLesson(key) {
      unlockAudio();
      current = lessons[key] || lessons.dino;
      index = 0;
      document.getElementById("lessonTitle").textContent = current.title;
      document.getElementById("lessonDesc").textContent = current.desc;
      document.querySelector(".level-badge").textContent = current.level || "1단계";
      showScreen("lesson");
      render();
      setTimeout(() => speakQuestion(true), 500);
    }

    function render() {
      const item = current.items[index];
      document.getElementById("questionText").textContent = item.q;
      document.getElementById("promptText").textContent = item.prompt;
      document.getElementById("reward").classList.remove("show");
      document.getElementById("progress").style.width = ((index + 1) / current.items.length * 100) + "%";
      document.getElementById("count").textContent = `${index + 1}/${current.items.length}`;
      document.getElementById("speechBubble").innerHTML = "잘하고<br>있어요! 💕";

      const box = document.getElementById("choices");
      box.innerHTML = "";
      item.choices.forEach(c => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.textContent = c;
        btn.onclick = () => answer(btn, c, item.answer);
        box.appendChild(btn);
      });

      if (autoSpeak && soundUnlocked && document.getElementById("lesson").classList.contains("active")) {
        setTimeout(() => speakQuestion(true), 420);
      }
    }

    function speakQuestion(cancelFirst = true) {
      const item = current.items[index];
      if (!("speechSynthesis" in window)) return;
      if (cancelFirst) window.speechSynthesis.cancel();

      const utter = new SpeechSynthesisUtterance(item.speak || item.prompt);
      utter.lang = "ko-KR";
      utter.rate = .82;
      utter.pitch = 1.22;
      utter.volume = 1;
      window.speechSynthesis.speak(utter);
    }

    function speakText(text, rate = .9, pitch = 1.25) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "ko-KR";
      utter.rate = rate;
      utter.pitch = pitch;
      utter.volume = 1;
      window.speechSynthesis.speak(utter);
    }

    function answer(btn, choice, ans) {
      unlockAudio();
      document.querySelectorAll(".choice").forEach(b => b.disabled = true);
      solved++;

      if (choice === ans) {
        correct++;
        btn.classList.add("correct");
        document.getElementById("rewardTitle").innerHTML = '우와! <span>정답이에요!</span>';
        document.getElementById("rewardText").textContent = "스티커 2개를 받았어요! ✨";
        document.getElementById("speechBubble").innerHTML = "정말<br>잘했어! 💖";
        document.getElementById("reward").classList.add("show");
        playSuccessSound();
        confetti();
        setTimeout(() => speakText("잘했어! 정답이에요!", .88, 1.35), 220);
      } else {
        btn.classList.add("wrong");
        document.querySelectorAll(".choice").forEach(b => {
          if (b.textContent === ans) b.classList.add("correct");
        });
        document.getElementById("rewardTitle").innerHTML = '아하! <span>정답은 ' + ans + '</span>';
        document.getElementById("rewardText").textContent = "괜찮아요. 다시 하면 더 잘할 수 있어요!";
        document.getElementById("speechBubble").innerHTML = "괜찮아<br>다시 해봐! 🌈";
        document.getElementById("reward").classList.add("show");
        playSoftWrongSound();
        setTimeout(() => speakText("괜찮아. 정답은 " + ans + " 이야.", .86, 1.18), 180);
      }

      localStorage.setItem("solved", solved);
      localStorage.setItem("correct", correct);
      updateStats();

      setTimeout(() => {
        index++;
        if (index >= current.items.length) index = 0;
        render();
      }, 2300);
    }

    function playSuccessSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.5];

      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now + i * 0.09);
        gain.gain.setValueAtTime(0.0001, now + i * 0.09);
        gain.gain.exponentialRampToValueAtTime(0.18, now + i * 0.09 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.09 + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.09);
        osc.stop(now + i * 0.09 + 0.2);
      });
    }

    function playSoftWrongSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const notes = [392, 330];

      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now + i * 0.12);
        gain.gain.setValueAtTime(0.0001, now + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.09, now + i * 0.12 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.12 + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.12);
        osc.stop(now + i * 0.12 + 0.24);
      });
    }

    function confetti() {
      const area = document.getElementById("confetti");
      area.innerHTML = "";
      area.classList.add("show");
      const colors = ["#ff69bc","#ffe56d","#6ee7c8","#9b5cff","#7cb7ff","#ffb84f"];
      for (let i = 0; i < 54; i++) {
        const p = document.createElement("i");
        p.style.left = Math.random() * 100 + "vw";
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.animationDelay = Math.random() * .38 + "s";
        p.style.transform = `rotate(${Math.random()*180}deg)`;
        area.appendChild(p);
      }
      setTimeout(() => area.classList.remove("show"), 1300);
    }

    function updateStats() {
      const rate = solved ? Math.round(correct / solved * 100) : 0;
      document.getElementById("statSolved").textContent = solved;
      document.getElementById("statCorrect").textContent = correct;
      document.getElementById("statRate").textContent = rate + "%";
      document.getElementById("statStars").textContent = correct * 2;
    }

    updateStats();
    render();
  </script>
</body>
</html>
