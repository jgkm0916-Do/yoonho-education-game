<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>윤호의 한글 월드 — 학습</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Dongle:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/lesson.css" />
</head>
<body>
  <div class="confetti" id="confetti"></div>
  <div class="complete-overlay" id="completeOverlay">
    <div class="complete-card">
      <h2>단계 완료!</h2>
      <p id="completeMsg">다음 단계로 갈까요?</p>
      <p id="completeStars" class="complete-stars"></p>
      <button type="button" class="complete-btn" id="completeOtherBtn" hidden>다른 놀이 하기</button>
      <button type="button" class="complete-btn complete-btn-secondary" id="completeBtn">단계 선택으로</button>
    </div>
  </div>
  <main class="app">
    <div class="top-row">
      <a class="circle-btn" id="backBtn" href="stages.html" aria-label="단계 선택">‹</a>
      <div class="level-badge" id="levelBadge">1단계</div>
      <div style="width:58px"></div>
    </div>
    <div class="stage-hero">
      <div>
        <h1 class="world-title" id="lessonTitle">공룡숙</h1>
        <div class="instruction" id="lessonDesc">자음 소리를 듣고 맞는 글자를 골라요.</div>
      </div>
      <div class="speech" id="speechBubble">잘하고<br>있어요!</div>
      <div class="mascot-wrap">
        <img id="mascotImg" src="" alt="캐릭터" width="170" height="180" />
      </div>
    </div>
    <div class="progress-box">
      <div class="star-coin">⭐</div>
      <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
      <span class="progress-count" id="count">1/5</span>
    </div>
    <div class="mode-tabs" id="modeTabs" hidden>
      <button type="button" class="mode-tab is-active" data-mode="order-tap" id="tabOrder">자음 순서</button>
      <button type="button" class="mode-tab" data-mode="read-along" id="tabRead">따라 읽기</button>
      <button type="button" class="mode-tab" data-mode="trace" id="tabTrace">따라쓰기</button>
      <button type="button" class="mode-tab" data-mode="assemble" id="tabAssemble">끌어서 만들기</button>
    </div>
    <div class="question-card">
      <button type="button" class="sound-btn" id="soundBtn">🔊</button>
      <div class="big-letter" id="questionText">ㄱ</div>
      <div class="stroke-tip" id="strokeTip" hidden></div>
      <div class="prompt" id="promptText">“기역”은 어디 있을까?</div>
      <div class="play-area" id="playArea" hidden></div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="reward" id="reward">
      <h3 id="rewardTitle">우와! <span>정답이에요!</span></h3>
      <p id="rewardText">잘했어요!</p>
    </div>
  </main>
  <script src="js/progress.js"></script>
  <script src="js/strokeData.js"></script>
  <script src="js/questionBank.js"></script>
  <script src="js/lesson.js"></script>
</body>
</html>
